<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bloom GitHub preview</title>
<style>
  /* 1280 × 640: GitHub's social preview size and the top of each README, opened as github.html?lang=<en|ko|ja|zh>.
     The README pictures' flow: the mark, a two-tone line (the claim in white, what it is in grey), then the real
     app on a dark screen with one level line of light behind it and the taskbar add-on's pill under it.
     Bloom 0.19's look: zinc greys, the white accent preset, G2 corners, the app's fonts (Segoe UI Variable with
     Malgun Gothic, Yu Gothic UI or Microsoft YaHei UI). The pictures are the real app at 2× (QA set readme-home and
     the taskbar editor's preview, --demo). */
  :root {
    --ground: #0b0b0d; --win: #18181b; --fg: #ecedee; --muted: #85858d; --sq-k: 1.32; --sq-m: 1.2;
    --sans: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", "Malgun Gothic", sans-serif;
  }
  :lang(ja) { --sans: "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", sans-serif; --display: "Segoe UI Variable Display", "Segoe UI", "Yu Gothic UI", sans-serif; }
  :lang(zh-CN) { --sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; --display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--ground); }
  body { position: relative; font-family: var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; word-break: keep-all; }
  :lang(ja), :lang(zh-CN) { word-break: normal; line-break: strict; }
  #art { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #121215 0, var(--ground) 300px); }

  .brand { position: absolute; left: 0; right: 0; top: 44px; display: flex; justify-content: center; align-items: center; gap: 12px;
           font: 600 25px/1 var(--display); }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .say { position: absolute; left: 50%; top: 104px; width: 1100px; transform: translateX(-50%); text-align: center;
         font: 600 44px/1.3 var(--display); }
  .say .s1, .say .s2 { display: block; }
  .say .s2 { color: var(--muted); font-weight: 400; }

  /* the screen runs off the bottom edge; the light, in layers on one level line, sits behind the app, and the app's
     window ends above the pill, which sits on the dark floor like a taskbar */
  .screen { --r: 22px; position: absolute; left: 64px; top: 268px; width: 1152px; height: 420px; overflow: hidden;
            background: linear-gradient(180deg, #131316 0, #0d0d10 100%);
            border-radius: calc(var(--r) * var(--sq-m)); corner-shape: superellipse(var(--sq-k)); }
  .screen::after { content: ""; position: absolute; inset: 0; border-radius: inherit; corner-shape: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); pointer-events: none; }
  .lit { position: absolute; left: 0; right: 0; top: 150px; transform: translateY(-50%); }
  .haze { height: 600px; background: radial-gradient(56% 50% at 50% 50%, rgba(255, 255, 255, .085), rgba(255, 255, 255, .02) 60%, rgba(255, 255, 255, 0) 80%); }
  .glow { height: 120px; background: radial-gradient(50% 50% at 50% 50%, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 100%); }
  .tight { height: 18px; background: radial-gradient(52% 50% at 50% 50%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 100%); }
  .line { height: 2px; background: linear-gradient(90deg, rgba(255, 255, 255, 0) 3%, rgba(255, 255, 255, .4) 18%, rgba(255, 255, 255, .95) 38%, #fff 50%, rgba(255, 255, 255, .95) 62%, rgba(255, 255, 255, .4) 82%, rgba(255, 255, 255, 0) 97%); }
  .floor { position: absolute; left: 0; right: 0; top: 150px; bottom: 0; background: linear-gradient(180deg, rgba(8, 8, 10, .55), rgba(8, 8, 10, .85)); }
  .win { position: absolute; left: 156px; top: 40px; width: 840px; height: 242px; overflow: hidden; background: var(--win); --r: 14px;
         border-radius: calc(var(--r) * var(--sq-m)); corner-shape: superellipse(var(--sq-k));
         box-shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 2px 10px rgba(0, 0, 0, .45); }
  .win::after { content: ""; position: absolute; inset: 0; border-radius: inherit; corner-shape: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
  .win img { display: block; width: 100%; }
  .pill { position: absolute; left: 50%; top: 296px; height: 58px; transform: translateX(-50%); overflow: hidden; border-radius: 999px;
          box-shadow: 0 18px 48px rgba(0, 0, 0, .65); }
  .pill img { display: block; height: 100%; }
</style>
</head>
<body>
<div id="art">
  <div class="brand"><img src="assets/mark-tile.png" alt="">Bloom</div>
  <p class="say"></p>
  <div class="screen">
    <div class="floor"></div><div class="lit haze"></div><div class="lit glow"></div><div class="lit tight"></div><div class="lit line"></div>
    <div class="win"><img data-img="home"></div>
    <div class="pill"><img src="assets/pill.png" alt=""></div>
  </div>
</div>
<script>
  // Words per language: what Bloom is, then how it opens. Labels are the app's own (docs/COPY.md glossary).
  const T = {
    en: ["Search and AI on one line.", "A native Windows launcher that opens with one key."],
    ko: ["검색과 AI를 한 줄에서.", "키 하나로 여는 Windows 네이티브 런처입니다."],
    ja: ["検索と AI を 1 行で。", "キー 1 つで開く Windows のネイティブランチャーです。"],
    zh: ["一行搞定搜索和 AI。", "一个键就能打开的 Windows 原生启动器。"],
  };
  const lang = new URLSearchParams(location.search).get("lang") || "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  document.querySelector(".say").innerHTML = `<span class="s1">${esc(T[lang][0])}</span><span class="s2">${esc(T[lang][1])}</span>`;
  for (const img of document.querySelectorAll("[data-img]")) img.src = `assets/${lang}-${img.dataset.img}.png`;
  // letter and word spacing: optical.js, per pair. Korean pairs move halfway to the median, Japanese and Chinese keep
  // most of their full-width punctuation's white, English word spaces count more of a letter's open side
  const OPT = { ko: { track: -0.012, space: 0.1, strength: 0.55 }, ja: { track: 0, space: 0.1, strength: 0.15 },
                zh: { track: 0, space: 0.1, strength: 0.15 }, en: { track: -0.01, space: 0.25, strength: 0.7, spaceDepth: 0.09 } }[lang];
  window.OPTICAL = [{ sel: ".brand", track: -0.01 }, ...[".say .s1", ".say .s2"].map(sel => ({ sel, ...OPT }))];
  Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => {
    const s = document.createElement("script");
    s.src = "optical.js";
    s.onload = () => {
      const wait = () => document.documentElement.dataset.optical === "done" ? (window.__ready = true) : setTimeout(wait, 50);
      wait();
    };
    document.body.appendChild(s);
  });
</script>
</body>
</html>
