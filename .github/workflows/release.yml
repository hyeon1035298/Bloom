# Release: builds Bloom on GitHub, packs the setup file and the update packages with Velopack, and publishes them as
# the release v<Version> (the <Version> in src/Bloom/Bloom.csproj). Started by hand: Actions > Release > Run workflow.
# Installed copies find it the next time they look (App/Updates.cs).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the notes

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content src/Bloom/Bloom.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          if (-not $v) { throw 'no <Version> in Bloom.csproj' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # the add-ons in addons/catalog.json ({"addons": [{id, repo, minVersion, ...}]}), which Bloom embeds and Settings >
      # Add-ons downloads from each repository's latest release: a gate only, nothing of them goes into the release. Each
      # latest release's bloom-addon.json is read as Bloom reads it, the zip it names downloaded from the same release and
      # checked against its sha256 and size and unpacked, and its addon.json must give that id, version and minBloom; no
      # release while an add-on's latest release has no bloom-addon.json, is before its minVersion or fails a check
      - name: Add-ons
        shell: pwsh
        run: |
          function Before([string]$a, [string]$b) {
              $na = [version]($a -split '[-+]', 2)[0]; $nb = [version]($b -split '[-+]', 2)[0]
              if ($na -ne $nb) { return $na -lt $nb }
              return ($a -ne $b) -and ($a.Length -gt $na.ToString().Length) -and ($b.Length -eq $nb.ToString().Length -or [string]::CompareOrdinal($a, $b) -lt 0)
          }
          $list = @((Get-Content addons/catalog.json -Raw | ConvertFrom-Json).addons)
          foreach ($a in $list) {
              if ($a.id -notmatch '^[a-z0-9-]+$') { throw "addons/catalog.json: '$($a.id)' is not lowercase letters, digits and -" }
              if ($a.repo -notmatch '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$') { throw "addons/catalog.json: $($a.id) has no owner/name repo" }
              $latest = Join-Path $env:RUNNER_TEMP "$($a.id).bloom-addon.json"
              Invoke-WebRequest -Uri "https://github.com/$($a.repo)/releases/latest/download/bloom-addon.json" -OutFile $latest
              $r = Get-Content -LiteralPath $latest -Raw | ConvertFrom-Json
              if ($r.id -ne $a.id) { throw "$($a.repo): bloom-addon.json is for '$($r.id)', not $($a.id)" }
              if ($r.zip -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*\.zip$') { throw "$($a.repo): bloom-addon.json names no plain .zip" }
              if (Before $r.version $a.minVersion) { throw "$($a.repo): the latest release $($r.version) is before the catalog's minVersion $($a.minVersion)" }
              $zip = Join-Path $env:RUNNER_TEMP "$($a.id).zip"
              Invoke-WebRequest -Uri "https://github.com/$($a.repo)/releases/download/v$($r.version)/$($r.zip)" -OutFile $zip
              $got = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
              if ($got -ne $r.sha256) { throw "$($a.repo): $($r.zip) is $got, not the sha256 its bloom-addon.json gives" }
              $length = (Get-Item -LiteralPath $zip).Length
              if ($length -ne $r.size) { throw "$($a.repo): $($r.zip) is $length bytes, not the size its bloom-addon.json gives" }
              $dir = Join-Path $env:RUNNER_TEMP "addons/$($a.id)"
              Expand-Archive -LiteralPath $zip -DestinationPath $dir
              $m = Get-Content -LiteralPath (Join-Path $dir addon.json) -Raw | ConvertFrom-Json
              if ($m.id -ne $r.id -or $m.version -ne $r.version -or $m.minBloom -ne $r.minBloom) {
                  throw "$($a.repo): the zip holds $($m.id) $($m.version) (Bloom $($m.minBloom)), not what its bloom-addon.json gives"
              }
              "$($a.id) $($r.version): ok"
          }

      # the release's text: its "## <version>" section of CHANGELOG.md, or else the commits since the last release
      - name: Notes
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8 -ErrorAction SilentlyContinue)
          $start = [Array]::IndexOf($lines, "## $v")
          $body = @()
          if ($start -ge 0) {
              for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $body += $lines[$i] }
          }
          $notes = ($body -join "`n").Trim()
          if (-not $notes) {
              $tags = @(git tag --list 'v*' --sort=-v:refname)
              $range = if ($tags.Count -gt 0) { "$($tags[0])..HEAD" } else { 'HEAD' }
              $notes = (@(git log $range --no-merges --format='- %s')) -join "`n"
          }
          $notes | Set-Content notes.md -Encoding utf8

      # Bloom and the elevated Win-key helper (issue #3, NativeAOT: the runner has the C++ build tools), with
      # package.ps1's checks; no add-ons (package.ps1 -Addon is for local installs only)
      - name: Publish
        shell: pwsh
        run: ./tools/package.ps1 -Out publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # the last release, so the new one also gets a small delta package (none yet before the first release)
      - name: Download the last release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      # framework-dependent: the setup installs the .NET 10 Desktop Runtime when the PC lacks it
      - name: Pack
        run: >-
          vpk pack --packId BloomLauncher --packVersion ${{ steps.version.outputs.version }} --packDir publish
          --runtime win-x64 --mainExe Bloom.exe --packTitle Bloom --packAuthors Hyeon --icon src/Bloom/Assets/icon.ico
          --framework net10.0-x64-desktop --shortcuts StartMenuRoot --releaseNotes notes.md

      - name: Upload
        run: >-
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "Bloom ${{ steps.version.outputs.version }}" --tag v${{ steps.version.outputs.version }}
